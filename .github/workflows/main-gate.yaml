name: Main Gate

# Main Gate: PR from main/{ref} (full route, 3 commits — created off
# build/{ref} once the build commit is ready, since build/{ref} only ever
# receives the Build Gate PR merge and is branch-protected against direct
# pushes) or task/{ref} (quick route, 1 commit) -> main.
# Thin wrapper around `pnpm gate-check main-gate` — the single source of
# truth for the actual validation logic (spec/test/build or task commit
# structure, coverage thresholds, and a real `tsc` build). See
# packages/gate-checks for the implementation; nothing here re-derives it.
# Human approval (required reviewers) and human override (admin bypass of a
# failing required check) are configured in branch protection, not here.

on:
  pull_request:
    branches:
      - 'main'

concurrency:
  group: main-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  validate-main-gate:
    if: startsWith(github.head_ref, 'main/') || startsWith(github.head_ref, 'task/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout PR head (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build every package
        run: pnpm -r build

      - name: Reinstall to link workspace bins (dist/ now exists)
        run: rm -rf node_modules && pnpm install --frozen-lockfile

      - name: Run Main Gate
        run: |
          set +e
          pnpm gate-check main-gate \
            --head-ref "${{ github.head_ref }}" \
            --destination-branch "origin/${{ github.event.pull_request.base.ref }}" \
            --json > result.json
          cat result.json

      - name: Report result
        run: |
          # pnpm exec appends its own "[ELIFECYCLE] Command failed..." line
          # to stdout whenever the wrapped command exits non-zero (i.e.
          # whenever the gate genuinely fails) - result.json can have a
          # second, non-JSON line in that case. Only the first line is
          # ever the actual gate-check result.
          head -1 result.json > result-line.json

          PASSED=$(node -e "console.log(JSON.parse(require('fs').readFileSync('result-line.json')).passed)")

          if [ "$PASSED" = "true" ]; then
            gh api "/repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
              -f state=success -f context=MainGate -f description="All MainGate validations pass"
            gh api "/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              -f body="All MainGate validations pass"
          else
            SUMMARY=$(node -e "console.log(JSON.parse(require('fs').readFileSync('result-line.json')).summary)")
            VIOLATIONS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('result-line.json')).violations.join('\n'))")
            gh api "/repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
              -f state=failure -f context=MainGate -f description="MainGate validation failed"
            gh api "/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              -f body="$VIOLATIONS"
            echo "::error::$SUMMARY"
            exit 1
          fi
