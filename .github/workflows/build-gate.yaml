name: Build Gate

# Build Gate: PR from test/{ref} -> build/{ref}
# Thin wrapper around `pnpm gate-check build-gate` — the single source of
# truth for the actual validation logic (spec/test commit structure,
# fail-then-pass, coverage thresholds, and a real `tsc` build). See
# packages/gate-checks for the implementation; nothing here re-derives it.
# Human approval (required reviewers) and human override (admin bypass of a
# failing required check) are configured in branch protection, not here.

on:
  pull_request:
    branches:
      - 'build/**'

concurrency:
  group: build-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  validate-build-gate:
    if: startsWith(github.head_ref, 'test/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout PR head (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build every package
        run: pnpm -r build

      - name: Reinstall to link workspace bins (dist/ now exists)
        run: rm -rf node_modules && pnpm install --frozen-lockfile

      - name: Run Build Gate
        env:
          # The test suite's own gh.test.ts (MAG-46 spec 03) runs real
          # gh commands against a separate fixture repo
          # (weaver-engineering/sandbox-task-phases-DO-NOT-DELETE) — the
          # default github.token is scoped only to this repo and can't
          # even see that one, let alone clone/PR into it. Nothing else
          # in this step needs github.token, so it's safe to override
          # just here rather than job-wide (the report steps below still
          # need github.token to post back on *this* repo).
          GH_TOKEN: ${{ secrets.SANDBOX_GH_TOKEN }}
        run: |
          # gh's own authentication doesn't automatically extend to plain
          # `git clone`/`git push` (gh.test.ts uses both, not just the gh
          # CLI) — wire up git's credential helper to delegate to gh,
          # using the GH_TOKEN set above, so both work the same way.
          gh auth setup-git

          # pipefail so this step's own pass/fail genuinely reflects the
          # gate-check's exit code (0 = passed, 1 = failed, 2 = invalid
          # args), not tee's or node's — both always exit 0. Piped through
          # tee (rather than `> result.json`) so the raw JSON is still
          # captured for the artifact/failure step, and rendered as YAML
          # in this step's own log — the thing a human actually wants to
          # read when this fails — since a single-line JSON blob isn't.
          set -o pipefail
          pnpm gate-check build-gate \
            --head-ref "${{ github.head_ref }}" \
            --destination-branch "origin/${{ github.event.pull_request.base.ref }}" \
            --json | tee result.json | node .github/scripts/json-to-yaml.mjs

      - name: Upload gate-check artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-gate-result-${{ github.event.pull_request.number }}
          path: |
            result.json
            coverage/
          retention-days: 30

      - name: Report success
        if: success()
        run: |
          gh api "/repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state=success -f context=BuildGate -f description="All BuildGate validations pass"
          gh api "/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -f body="All BuildGate validations pass"

      - name: Report failure
        if: failure()
        run: |
          gh api "/repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state=failure -f context=BuildGate -f description="BuildGate validation failed"

          if [ ! -f result.json ]; then
            gh api "/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              -f body="BuildGate failed before the check could run — see the workflow run for details."
            exit 1
          fi

          # pnpm exec appends its own "[ELIFECYCLE] Command failed..." line
          # to stdout whenever the wrapped command exits non-zero - only
          # the first line of result.json is ever the actual gate result.
          head -1 result.json > result-line.json
          SUMMARY=$(node -e "console.log(JSON.parse(require('fs').readFileSync('result-line.json')).summary)")
          VIOLATIONS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('result-line.json')).violations.join('\n'))")
          gh api "/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -f body="$VIOLATIONS"
          echo "::error::$SUMMARY"
